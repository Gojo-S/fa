.passage{background:var(--card);border-color:var(--edge);color:#fff}
.unitBanner{border-radius:16px;padding:16px 18px;color:#fff;margin:26px 0 8px;box-shadow:0 5px 0 rgba(0,0,0,.35)}

.unitBanner.blue{background:#1cb0f6;box-shadow:0 5px 0 #1899d6}
.unitBanner.orange{background:#ff9600;box-shadow:0 5px 0 #e08600}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 28px}
.nodeWrap{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .3s}
.node{width:76px;height:68px;border-radius:50%;border:0;background:var(--g);box-shadow:0 8px 0 var(--gd);color:#fff;font-size:28px;font-weight:800;position:relative;transition:transform .08s,box-shadow .08s;padding:0}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--gd)}
.node:disabled{cursor:not-allowed}
.node.locked{background:var(--edge);box-shadow:0 8px 0 #222f36;color:#5b7083}
.node.done{background:#ffc800;box-shadow:0 8px 0 #cc9f00;color:#fff}
.node.cur{animation:pulse 1.6s ease-in-out infinite}
.nlabel{font-size:12px;font-weight:700;color:var(--mut);max-width:150px;text-align:center;line-height:1.4}
.bubble{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:#fff;color:var(--g);font-size:14px;font-weight:800;padding:6px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 var(--edge);animation:bob 1.2s ease-in-out infinite}
.bubble::after{content:'';position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.mistake{background:#ce82ff;border-radius:16px;padding:16px 18px;color:#fff;margin:24px 0 8px;box-shadow:0 5px 0 #a568cc;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mistake h2{margin:2px 0;font-size:18px}.mistake p{margin:0;font-size:14px;opacity:.92;font-weight:600}
.mistake .btn{background:#fff;color:#a568cc;box-shadow:0 4px 0 #d9c2e8;white-space:nowrap}
.mistake.off{background:var(--edge);box-shadow:0 5px 0 #222f36;opacity:.7}
.mistake.off .btn{background:var(--edge);color:#5b7083;box-shadow:none}




@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* ── بازطراحی: نیمه‌شب آبی، کارت‌های نرم، شش‌ضلعی‌ها ── */
:root{--bg:#0c1a2e;--card:#142a43;--card2:#183350;--edge:#24425f;--txt:#f1f6fb;--mut:#8ea5bd;--g:#34c38f;--gd:#27a074;--gold:#f5b73d;--ac:#34c38f}
html{background:#0c1a2e}
body{background:radial-gradient(120% 60% at 50% -10%,#16365a 0%,#0c1a2e 55%) fixed,#0c1a2e;color:var(--txt);font-size:16px;line-height:1.6;min-height:100vh}
.top{background:rgba(12,26,46,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--edge);padding:10px 16px}
.brand{font-size:17px;color:var(--txt)}
.brand::before{display:none}
.stats{gap:6px}
.pill{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700}
.container{max-width:520px;padding:20px 16px 48px}
.btn{background:linear-gradient(180deg,#3fd0997a,#34c38f) ,var(--g);background:var(--g);color:#06241a;border-radius:16px;font-weight:800;box-shadow:0 8px 22px rgba(52,195,143,.22)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.secondary{background:var(--card);color:#7cc4ff;border:1px solid var(--edge);box-shadow:none}
.btn:disabled{background:#1a2f48;color:#58708a;box-shadow:none}
.panel,.passage,.wordCard,.resultStat div{background:var(--card);border:1px solid var(--edge);border-radius:18px;box-shadow:none;color:var(--txt)}
.wordCard span,.resultStat div{color:var(--mut)}
.resultStat b{color:var(--g)}
.progress{background:#1a3350;height:12px;border-radius:99px}
.progress i{background:linear-gradient(90deg,#34c38f,#5ee0b0);border-radius:99px}
.choice,.chip,.pair,.textIn{background:var(--card);border:1.5px solid var(--edge);border-radius:16px;color:var(--txt);box-shadow:none}
.choice:hover:not(:disabled),.pair:not(:disabled):hover{background:var(--card2)}
.choice.selected,.pair.selected{background:#16405e;border-color:#5db7f5;color:#bfe3ff}
.good,.pair.matched{background:#10392e!important;border-color:var(--g)!important;color:#7ff0c3!important}
.bad{background:#3d1b27!important;border-color:#ef6b7e!important;color:#ffb3bf!important}
.textIn:focus{border-color:#5db7f5}
.wordSlots{border-color:var(--edge)}
.feedback{background:var(--card);color:var(--txt);border-top:1px solid var(--edge)}
.feedback.correct{background:#0f3a2d;border-color:#1f7a5c}
.feedback.wrong{background:#3b1a26;border-color:#8a3447}
.feedback.correct .fbText{color:#7ff0c3}
.feedback.wrong .fbText{color:#ff9aab}
.fbAns{color:var(--txt)}
.feedback.correct .btn{background:var(--g);box-shadow:none;color:#06241a}
.feedback.wrong .btn{background:#ef6b7e;box-shadow:none;color:#fff}
.toast{background:var(--card2);color:var(--txt);border:1px solid var(--edge)}

/* خانه */
.greet{margin:4px 2px 14px}
.greet h1{margin:0;font-size:26px;font-weight:800;color:var(--txt)}
.greet p{margin:4px 0 0;color:var(--mut);font-size:14px}
.dcard{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:16px}
.week{display:flex;justify-content:space-between;gap:4px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut);flex:1}
.hex{width:42px;height:46px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--mut);background:var(--edge);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative}
.hex::before{content:'';position:absolute;inset:2.5px;background:#102440;clip-path:inherit}
.hex>*{position:relative}
.hex.on{background:var(--g);color:#06241a}
.hex.on::before{background:var(--g)}
.hex.today:not(.on){background:#5db7f5;color:#bfe3ff}
.day.today{color:var(--txt);font-weight:700}
.streakNote{border:1px solid #1f7a5c;background:linear-gradient(180deg,#0f3a2d,#0e2f2c);border-radius:18px;padding:14px 16px;margin:12px 0}
.streakNote b{display:block;color:#7ff0c3;font-size:17px}
.streakNote span{color:var(--mut);font-size:14px}
.streakNote.todo{border-color:var(--edge);background:var(--card)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}

.grid2 .dcard strong{display:block;font-size:34px;font-weight:800;line-height:1.3;margin-top:4px}

.secH{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px}
.secH h3{margin:0;font-size:18px;font-weight:800}
.secH span{color:var(--mut);font-size:13px}
.badges{display:flex;gap:6px;justify-content:space-between}
.bdg{flex:1;text-align:center;font-size:12px;color:var(--txt);font-weight:600;line-height:1.4;min-width:0}
.bdg .hex{width:62px;height:68px;margin:0 auto 8px;font-size:26px;background:var(--g)}
.bdg .hex::before{background:#0f4a3b}
.bdg.lock{color:var(--mut)}
.bdg.lock .hex{background:#2b4058;filter:grayscale(1);opacity:.85}
.bdg.lock .hex::before{background:#16283d}
.pathH{margin:26px 2px 0}
.pathH h3{margin:0;font-size:18px;font-weight:800}

/* واحدها و مسیر */
.unitBanner{border-radius:20px;border:1px solid var(--edge);box-shadow:none;margin:22px 0 4px;padding:16px 18px;color:var(--txt);background:linear-gradient(135deg,var(--card2),var(--card));position:relative;overflow:hidden}
.unitBanner::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--uc)}
.unitBanner.purple{--uc:#b08cff;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:none}
.unitBanner.green{--uc:#34c38f;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:none}
.unitBanner.blue{--uc:#5db7f5;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:none}
.unitBanner.orange{--uc:#f5b73d;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:none}
.unitBanner small{color:var(--uc);opacity:1}
.unitBanner p{color:var(--mut);opacity:1}
.node{width:78px;height:86px;border-radius:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--g);box-shadow:none;color:#06241a;font-size:26px;position:relative}
.node::before{content:'';position:absolute;inset:4px;background:#0f4a3b;clip-path:inherit;z-index:0}
.node>*{position:relative;z-index:1}
.node{color:#7ff0c3}
.node.done{background:var(--gold)}
.node.done::before{background:#4a3a12}
.node.done{color:var(--gold)}
.node.locked{background:#2b4058}
.node.locked::before{background:#16283d}
.node.locked{color:#5b7590}
.node.cur{background:#7ff0c3;filter:drop-shadow(0 0 12px rgba(52,195,143,.55))}
.node:active:not(:disabled){transform:scale(.95);box-shadow:none}
.nlabel{color:var(--mut)}
.bubble{background:var(--g);color:#06241a;box-shadow:none;clip-path:none;top:-40px}
.bubble::after{border-top-color:var(--g)}
.mistake{background:var(--card);border:1px solid #5b4a8a;box-shadow:none;border-radius:20px;color:var(--txt);margin:14px 0 0}
.mistake .btn{background:#b08cff;color:#1b1038;box-shadow:none}
.mistake.off{background:var(--card);border-color:var(--edge);opacity:.75;box-shadow:none}
.mistake.off .btn{background:#1a2f48;color:#58708a}
.profBtn{background:var(--card);border:1px solid var(--edge);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--txt)}
.btn.danger{background:#ef6b7e;color:#fff;box-shadow:none;width:100%}
.prow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--edge)}
.prow:last-child{border:0}
.node{width:112px;height:124px}
.node::before{inset:4px}
.node .nic{display:block;line-height:0;color:#5db7f5;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.node.locked .nic{color:#3a5170;opacity:.6}
.node.done .nic{color:#ffd76a}
.node .ntxt{display:block;padding:0 16px;font-size:11px;font-weight:700;line-height:1.35;font-family:inherit;color:#e8fff6;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.node.done .ntxt{color:#ffe7a8}
.node.locked .ntxt{color:#6f87a0}
.bubble{top:-34px}

/* ایکون‌های هدر: شش‌ضلعی هم‌رنگ با سایت */
.stats .pill,.profBtn{position:relative;isolation:isolate;border:0;border-radius:0;width:60px;height:56px;padding:0;display:grid;place-items:center;background:none;box-shadow:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:15px;color:var(--txt);cursor:default}
.stats .pill::before,.profBtn::before{content:'';position:absolute;inset:0;background:var(--hc);clip-path:inherit;z-index:-2}
.stats .pill::after,.profBtn::after{content:'';position:absolute;inset:3px;background:#102440;clip-path:inherit;z-index:-1}
.stats .pill:nth-child(1){--hc:var(--gold)}
.stats .pill:nth-child(2){--hc:#ef6b7e}
.stats .pill:nth-child(3){--hc:#ff9f43}
.stats .pill b{color:var(--txt);font-weight:800}
.profBtn{--hc:var(--g);cursor:pointer;font-size:18px}
.stats{align-items:center}
.top{align-items:center}

/* هدر: همان اندازه و رنگ شش‌ضلعی‌های روزهای هفته */
.stats .pill,.profBtn{width:42px;height:46px;font-size:13px}
.stats .pill::before,.profBtn::before{background:var(--edge)}
.stats .pill::after,.profBtn::after{background:#102440;inset:2.5px}
.stats .pill:nth-child(1),.stats .pill:nth-child(2),.stats .pill:nth-child(3),.profBtn{--hc:var(--edge)}
.stats .pill b{color:var(--mut);font-weight:800;font-size:12px}
.profBtn{color:var(--mut);font-size:15px}

/* امتیاز، قلب، زنجیره: آبی */
.stats .pill::before{background:#5db7f5}
.stats .pill b{color:#5db7f5}

/* آیکون‌های آبی، پایین‌تر از لبه‌ی بالایی شش‌ضلعی */
.stats .pill{padding-top:9px;align-content:center;justify-items:center;gap:0}
.stats .pill .hi{display:block;line-height:0;margin-bottom:1px}
.stats .pill b{font-size:12px}

/* کارت‌های یادگیری واژه */
.lcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px;border-radius:22px;background:linear-gradient(160deg,#17324f,#0f2640);border:1px solid #24425f;margin:6px 0 12px}
.lemo{font-size:72px;line-height:1.1}
.len{font-size:28px;color:#fff;font-weight:800}
.lfa{font-size:20px;color:var(--g)}
.lspk{margin-top:4px;min-width:120px}
.lprog{display:flex;gap:6px;justify-content:center;margin:6px 0}
.lprog i{width:22px;height:5px;border-radius:4px;background:#24425f}
.lprog i.on{background:var(--g)}

/* performance: حذف فیلترها و انیمیشن‌های بی‌پایان روی هشت‌ضلعی‌ها و نوار بالا */
.node .nic{filter:none}
.node.cur{animation:none;filter:none;box-shadow:0 0 0 3px rgba(127,240,195,.35)}
.node .nic,.node{will-change:auto}
.bubble{animation:none}
.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0c1a2e}
.screen.active{animation:none}
.lemo{width:110px;height:110px;margin:0 auto 10px;display:block}.lemo svg{display:block}
.lemo{color:#5db7f5}
.uic{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-inline-end:6px;line-height:0}.uic svg{width:100%;height:100%}
.mistake{display:flex;align-items:center;gap:14px}.mistake>div{flex:1;min-width:0}.mic{flex:0 0 auto;width:52px;height:52px;padding:10px;box-sizing:border-box;border:1.5px solid #5db7f5;border-radius:16px;background:#5db7f514;line-height:0}.mic svg{width:100%;height:100%}
.speakText{font-size:26px;font-weight:800;text-align:center;color:#5db7f5;margin:18px 0 10px;direction:ltr}
.speakOut{text-align:center;color:var(--txt);opacity:.85;min-height:24px;margin-bottom:14px}
.speakRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* دکمه بررسی همیشه پایین صفحه و بالای کیبورد */
#quiz{padding-bottom:110px}
#quiz .row:has(#checkBtn){position:fixed;left:0;right:0;bottom:0;margin:0!important;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg,#0a1628);border-top:1px solid var(--line,#1e3450);z-index:20}
#quiz .row:has(#checkBtn) .btn{width:100%}
/* پنجره‌ی تأیید سفارشی */
.cfBg{position:fixed;inset:0;background:rgba(3,8,18,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:cfIn .15s ease}
.cfBox{width:100%;max-width:360px;background:var(--card,#132742);border:1px solid var(--edge,#1e3450);border-radius:20px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cfMsg{margin:0 0 20px;font-size:16px;line-height:1.9;color:var(--txt,#e8f1ff);text-align:right}
.cfRow{display:flex;gap:10px}
.cfRow .btn{flex:1;margin:0}
@keyframes cfIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">انگلیسی‌فا</div>
  <button class="profBtn" id="profBtn" aria-label="پروفایل">👤</button>
  <div class="stats">
    <span class="pill"><i class="hi"><svg viewBox="0 0 24 24" width="14" height="14" fill="#5db7f5"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></i><b id="xp">۰</b></span>
    <span class="pill"><i class="hi"><svg viewBox="0 0 24 24" width="14" height="14" fill="#5db7f5"><path d="M12 21s-7.5-4.6-9.5-9C1 8.6 3.2 5 6.6 5c2.1 0 3.5 1.2 4.4 2.5C11.9 6.2 13.3 5 15.4 5 18.8 5 21 8.6 21.5 12c-2 4.4-9.5 9-9.5 9z"/></svg></i><b id="heartCount">۵</b></span>
    <span class="pill"><i class="hi"><svg viewBox="0 0 24 24" width="14" height="14" fill="#5db7f5"><path d="M12 2c1 3.5 5 5.5 5 11a5 5 0 0 1-10 0c0-2.2 1-3.7 2-4.8.2 1.6.9 2.6 2 3C10.6 8.5 11 5 12 2z"/></svg></i><b id="streak">۰</b></span>
  </div>
</header>
<main class="container">
  <section id="home" class="screen active">
    <div id="dash"></div>
    <div id="units"></div>
  </section>
  <section id="profile" class="screen">
    <div class="greet"><h1>پروفایل</h1><p>اطلاعات ذخیره‌شده روی همین دستگاه</p></div>
    <div id="profStats" class="dcard"></div>
    <div class="dcard" style="margin-top:12px"><b>پاک کردن اطلاعات</b>
      <p style="color:var(--mut);font-size:14px;margin:6px 0 12px">امتیاز، درس‌های انجام‌شده، زنجیره، قلب‌ها و اشتباهات برای همیشه پاک می‌شود.</p>
      <button class="btn danger" id="resetBtn">پاک کردن همه‌ی پیشرفت</button></div>
    <button class="btn secondary" id="profBack" style="margin-top:12px;width:100%">بازگشت</button>
  </section>
  <section id="intro" class="screen">
    <div class="center panel">
      <div class="hero" id="introIcon"></div>
      <h1 id="introTitle"></h1>
      <p class="sub" id="introDesc"></p>
      <div class="wordGrid" id="introWords"></div>
      <div class="row">
        <button class="btn secondary" onclick="renderHome()">برگشت</button>
        <button class="btn" onclick="startLesson()">شروع درس</button>
      </div>
    </div>
  </section>
  <section id="quiz" class="screen">
    <div class="quizTop">
      <button class="iconBtn" onclick="confirmExit()" aria-label="خروج از درس">×</button>
      <div class="progress"><i id="progressFill"></i></div>
      <span class="pill">❤️ <b id="quizHearts">۵</b></span>
    </div>
    <div class="qtype" id="qType"></div>
    <h1 class="prompt" id="prompt"></h1>
    <div id="questionArea"></div>
    <div class="row" style="margin-top:22px"><button class="btn" id="checkBtn" onclick="checkAnswer()" disabled>بررسی</button></div>
  </section>
  <section id="result" class="screen">
    <div class="center panel">
      <div class="hero" id="resultIcon">🏆</div>
      <h1 id="resultTitle"></h1>
      <p class="sub" id="resultSub"></p>
      <div class="resultStat">
        <div>⚡ تجربه<b id="earned"></b></div>
        <div>🎯 دقت<b id="accuracy"></b></div>
        <div>⏱ زمان<b id="elapsed"></b></div>
      </div>
      <div class="row">
        <button class="btn secondary" onclick="openLesson(CUR.id)">تلاش دوباره</button>
        <button class="btn" onclick="renderHome()">ادامه مسیر</button>
      </div>
    </div>
  </section>
</main>
<div id="feedback" class="feedback" aria-live="polite">
  <div><div class="fbText" id="fbText"></div><span class="fbAns" id="fbAns"></span></div>
  <button class="btn" onclick="nextQuestion()">ادامه</button>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
/* هر درس: t عنوان | v هشت واژه [فارسی, انگلیسی] | s دو جمله [فارسی, انگلیسی] */
const DATA = [

const MAX_HEARTS = 50, HEART_GAP = 30 * 60 * 1000;

function loadState() {
  const d = { ver: 2, xp: 0, hearts: MAX_HEARTS, streak: 0, last: '', done: [], hAt: Date.now(), wrong: [] };
  try { const o = JSON.parse(localStorage.getItem('englishfa') || '{}'); if (o.ver !== 2) { delete o.done; delete o.wrong; delete o.hAt; } return Object.assign(d, o); } catch (e) { return d; }
}
function saveState() { try { localStorage.setItem('englishfa', JSON.stringify(S)); } catch (e) {} updateHeader(); }
function updateHeader() {
  set('xp', p(S.xp)); set('streak', p(S.streak)); set('heartCount', p(S.hearts)); set('quizHearts', p(S.hearts));
}
function regenHearts() {
  const now = Date.now();
  if (S.hearts >= MAX_HEARTS) S.hAt = now;
  else {
    const n = Math.floor((now - S.hAt) / HEART_GAP);
    if (n > 0) { S.hearts = Math.min(MAX_HEARTS, S.hearts + n); S.hAt = S.hearts >= MAX_HEARTS ? now : S.hAt + n * HEART_GAP; }
  }
  saveState();
}
function loseHeart() {
  if (S.hearts >= MAX_HEARTS) S.hAt = Date.now();
  S.hearts = Math.max(0, S.hearts - 1); saveState();
}
const dayKey = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
function updateStreak() {
  const t = new Date().toDateString(), y = new Date(Date.now() - 864e5).toDateString();
  const k = dayKey(); S.days = S.days || []; if (!S.days.includes(k)) S.days = S.days.concat(k).slice(-60);

}

/* ── ساخت پرسش‌ها ── */
function buildQuestions(lesson) {
  if (lesson.r) return shuffle(lesson.rq.map(q => ({ type: 'mc', prompt: q.q, answer: q.o[q.a], options: shuffle(q.o), en: true, passage: lesson.r })));
  const seen = LESSONS.filter(l => l.id <= lesson.id && !l.review || l.id === lesson.id);
  const unitL = LESSONS.filter(l => l.ui === lesson.ui && !l.review);
  const all = seen.flatMap(l => l.v).concat(lesson.v), qs = [];
  const choices = (correct, idx) => {
    const pool = lesson.v.concat(pick(all, 8)).map(x => x[idx]).filter((x, i, a) => x !== correct && a.indexOf(x) === i);
    return shuffle([correct, ...pick(pool, 3)]);
  };
  const w = shuffle(lesson.v);
  const W = (a, b) => Array.from({ length: b - a }, (_, i) => w[(a + i) % w.length]);
  /* درس شنیداری: شنیدن و انتخاب/نوشتن ; درس گفتاری: تلفظ بلند */
  if (lesson.kind === 'listen') {
    lesson.v.forEach(([fa, en], i) => qs.push(i % 2
      ? { type: 'type', label: '🔊 بشنو و بنویس', prompt: 'واژه‌ای که شنیدی را بنویس', answer: en, audio: en, src: [fa, en] }
      : { type: 'mc', label: '🔊 به صدا گوش کن', prompt: 'کدام واژه را شنیدی؟', answer: en, options: choices(en, 1), en: true, audio: en, src: [fa, en] }));
    return shuffle(qs);
  }
  if (lesson.kind === 'speak') {
    lesson.v.forEach(([fa, en]) => qs.push({ type: 'speak', prompt: `این واژه را بلند بگو: «${fa}»`, answer: en, src: [fa, en] }));
    return shuffle(qs);
  }
  W(0, 3).forEach(([fa, en]) => qs.push({ type: 'mc', prompt: `«${fa}» به انگلیسی چی می‌شه؟`, answer: en, options: choices(en, 1), en: true, src: [fa, en] }));
  W(3, 5).forEach(([fa, en]) => qs.push({ type: 'mc', prompt: `معنی «${en}» چیست؟`, answer: fa, options: choices(fa, 0), en: false, src: [fa, en] }));
  qs.push({ type: 'match', prompt: 'جفت‌های مرتبط را پیدا کن', pairs: pick(lesson.v, 4) });
  W(5, 7).forEach(([fa, en]) => qs.push({ type: 'type', prompt: `«${fa}» را به انگلیسی بنویس`, answer: en, src: [fa, en] }));
  /* شنیدن: جمله را بشنو و بنویس */
  if (lesson.s[0]) qs.push({ type: 'type', prompt: '🔊 بشنو و بنویس', answer: lesson.s[0][1], audio: lesson.s[0][1], src: lesson.s[0] });
  /* مرور: واژه‌های درس‌های قبلی (فاصله‌گذاری) */
  const prior = lesson.noPrior ? [] : LESSONS.slice(0, lesson.id).flatMap(l => l.v);
  if (prior.length) {
    const rev = pick(prior, Math.min(3, prior.length));
    rev.slice(0, 2).forEach(([fa, en]) => qs.push({ type: 'mc', prompt: `«${en}» به فارسی چیست؟`, answer: fa, options: choices(fa, 0), en: false, src: [fa, en] }));
    rev.slice(2).forEach(([fa, en]) => qs.push({ type: 'type', prompt: `«${fa}» را به انگلیسی بنویس`, answer: en, src: [fa, en] }));
  }
  /* تنوع: شنیدن و انتخاب، جای‌خالی، انتخاب جمله */
  const lw = lesson.v.map(x => x[1]);
  const sv = (x, n) => shuffle([x, ...pick([...new Set(seen.concat(unitL.filter(l => l.id <= lesson.id || seen.length < 3)).flatMap(l => l.s || []).map(s => s[1]))].filter(s => s !== x), n)]);
  const ve = pick(lesson.v, 1)[0][1];
  qs.push({ type: 'mc', label: '🔊 به صدا گوش کن', prompt: 'کدام واژه را شنیدی؟', answer: ve, options: choices(ve, 1), en: true, audio: ve });
  if (lesson.s[1]) {
    const [sf, se] = lesson.s[1];
    const cand = se.replace(/[.?!]$/, '').split(' ').filter(x => lw.includes(x.toLowerCase()) || x.length > 3);
    if (cand.length) {
      const target = cand[cand.length - 1], blank = se.replace(/[.?!]$/, '').split(' ').map(x => x === target ? '____' : x).join(' ');
      const sent = se.replace(/[.?!,]/g, '').split(' ');
      const ok = x => x && !x.includes(' ') && x.toLowerCase() !== target.toLowerCase() && !sent.includes(x);
      const unitW = LESSONS.filter(l => l.ui === lesson.ui && (lesson.review || l.id <= lesson.id)).flatMap(l => l.v.map(v => v[1]));
      const near = [...new Set([...lw, ...unitW, ...(unitW.length < 6 ? all.map(v => v[1]) : [])].filter(ok))];
      const opts = shuffle([target, ...pick(near, 3)]);
      if (opts.length >= 3) qs.push({ type: 'mc', label: '✏️ جای خالی را پر کن', prompt: `«${blank}»`, answer: target, options: opts, en: true, src: [sf, se] });
    }
    qs.push({ type: 'mc', label: '📝 جمله‌ی درست را انتخاب کن', prompt: `کدام جمله معنی «${sf}» را می‌دهد؟`, answer: se, options: sv(se, 3), en: true, src: [sf, se] });
  }
  const others = seen.concat(lesson.review ? unitL : []).flatMap(l => l.s || []).flatMap(s => s[1].replace(/[.?!,]/g, '').split(' '));
  lesson.s.forEach(([fa, en]) => {
    const words = en.replace(/[.?!]$/, '').split(' ');
    const extra = pick(others.filter(x => !words.includes(x)), 2);
    qs.push({ type: 'word', prompt: `ترجمه کن: «${fa}»`, answer: words, bank: shuffle([...words, ...extra]), src: [fa, en] });
  });
  /* تمرین تلفظ: فقط در واحدهای مکالمه */
  if (/مکالمه/.test(lesson.unit.t) && !lesson.review && !lesson.mistakes) {
    lesson.s.forEach(([fa, en]) => qs.push({ type: 'speak', prompt: `این جمله را بلند بگو: «${fa}»`, answer: en, src: [fa, en] }));
    pick(lesson.v, 2).forEach(([fa, en]) => qs.push({ type: 'speak', prompt: `این واژه را بلند بگو: «${fa}»`, answer: en, src: [fa, en] }));
  }
  return shuffle(qs);
}

}

/* تمرین تلفظ: کاربر بلند می‌گوید؛ با تشخیص گفتار مقایسه می‌شود */
function renderSpeak(q, area) {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const big = el('div', 'speakText', q.answer); big.dir = 'ltr';
  const out = el('div', 'speakOut', Rec ? 'روی میکروفون بزن و بگو' : 'تشخیص گفتار در این مرورگر پشتیبانی نمی‌شود');
  const row = el('div', 'speakRow');
  const listen = el('button', 'btn secondary', '🔊 نمونه را بشنو');
  listen.onclick = () => speak(q.answer);
  const mic = el('button', 'btn', '🎤 بگو');
  row.append(listen, mic);
  area.append(big, out, row);
  if (!Rec) { mic.disabled = true; return; }
  let timer = null, got = false;
  const finish = (r, said) => {
    if (got) return; got = true; clearTimeout(timer);
    try { r.stop(); } catch (_) {}
    mic.disabled = false;
    Q.ans = said; ready(true); out.textContent = 'گفتی: ' + said;
  };
  mic.onclick = () => {
    if (Q.locked || mic.disabled) return;
    got = false;
    const r = new Rec();
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = true;
    mic.disabled = true; out.textContent = 'در حال گوش دادن... واژه را بگو';
    r.onresult = e => {
      let text = '', final = false;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
        if (e.results[i].isFinal) final = true;
      }
      if (final && text.trim()) finish(r, text.trim());
    };
    r.onerror = e => {
      clearTimeout(timer); mic.disabled = false;
      const code = e && e.error;
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        out.textContent = 'اجازه‌ی میکروفون داده نشده. در تنظیمات مرورگر به سایت اجازه‌ی میکروفون بده.';
      } else if (code === 'network') {
        out.textContent = 'تشخیص گفتار به اینترنت نیاز دارد؛ اتصال را بررسی کن یا صفحه را در Chrome باز کن.';
      } else if (code === 'audio-capture') {
        out.textContent = 'میکروفون پیدا نشد.';
      } else if (code === 'no-speech') {
        out.textContent = 'صدایی شنیده نشد؛ دوباره بزن و واضح بگو.';
      } else if (code !== 'aborted') {
        out.textContent = 'تشخیص گفتار خطا داد (' + code + '). دوباره بزن.';
      }
    };
    r.onend = () => { clearTimeout(timer); if (!got) { mic.disabled = false; if (out.textContent.indexOf('گوش') !== -1) out.textContent = 'صدایی شنیده نشد؛ دوباره بزن.'; } };
    timer = setTimeout(() => { if (!got) { try { r.stop(); } catch (_) {} } }, 8000);
    try { r.start(); } catch (_) { mic.disabled = false; out.textContent = 'شروع میکروفون ممکن نشد؛ دوباره بزن.'; }
  };
}
function renderWord(q, area) {
  Q.slots = [];
  const slots = el('div', 'wordSlots'), pool = el('div', 'wordPool');
  const draw = () => {
    slots.innerHTML = '';
    Q.slots.forEach((t, k) => {
      const c = el('button', 'chip en', t.w);
      c.onclick = () => { if (Q.locked) return; Q.slots.splice(k, 1); draw(); };
      slots.appendChild(c);
    });
    pool.querySelectorAll('.chip').forEach((c, k) => c.classList.toggle('used', Q.slots.some(s => s.k === k)));
    Q.ans = Q.slots.map(s => s.w); ready(Q.slots.length > 0);
  };
  q.bank.forEach((w, k) => {
    const c = el('button', 'chip en', w);
    c.onclick = () => { if (Q.locked || Q.slots.some(s => s.k === k)) return; Q.slots.push({ w, k }); draw(); };
    pool.appendChild(c);
  });
  area.append(slots, pool);
}
function renderMatch(q, area) {
  const wrap = el('div', 'matchWrap'), L = el('div', 'matchCol'), R = el('div', 'matchCol');
  let selL = null, selR = null, left = q.pairs.length, mistakes = 0;
  const test = () => {
    if (!selL || !selR) return;
    const a = selL, b = selR; selL = selR = null;
    if (a.dataset.k === b.dataset.k) {
      [a, b].forEach(x => { x.classList.remove('selected'); x.classList.add('matched'); x.disabled = true; });
      if (--left === 0) { Q.right += mistakes ? 0 : 1; finish(true, mistakes ? 'تمام شد، اما با چند اشتباه.' : 'همه‌ی جفت‌ها درست بود!', '', true); }
    } else {
      mistakes++; loseHeart(); [a, b].forEach(x => { const pr = q.pairs.find(pp => pp[1] === x.dataset.k); if (pr) trackWord(pr, false); });
      [a, b].forEach(x => { x.classList.remove('selected'); x.classList.add('bad'); });
      setTimeout(() => [a, b].forEach(x => x.classList.remove('bad')), 450);
      if (S.hearts <= 0) failLesson();
    }
  };
  const mk = (txt, k, isEn, side) => {
    const b = el('button', 'pair' + (isEn ? ' en' : ''), txt); b.dataset.k = k;
    b.onclick = () => {
      if (Q.locked || b.disabled) return;
      const col = side === 'L' ? L : R;
      col.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      if (side === 'L') selL = b; else selR = b;
      test();
    };
    return b;
  };
  shuffle(q.pairs).forEach(([fa, en]) => L.appendChild(mk(fa, en, false, 'L')));
  shuffle(q.pairs).forEach(([fa, en]) => R.appendChild(mk(en, en, true, 'R')));
  wrap.append(L, R); area.appendChild(wrap);
}

/* ── بررسی پاسخ ── */
function checkAnswer() {
  if (!Q || Q.locked) return;
  const q = Q.cur; let ok, shown;
  if (q.type === 'mc') { ok = Q.ans === q.answer; shown = q.answer; }
  else if (q.type === 'type') { ok = norm(Q.ans) === norm(q.answer); shown = q.answer; }
  else if (q.type === 'speak') { ok = !!Q.ans && norm(Q.ans) === norm(q.answer); shown = q.answer; }
  else { ok = Q.ans.join(' ') === q.answer.join(' '); shown = q.answer.join(' '); }
  Q.attempts++;
  if (ok) Q.right++;
  if (q.src) trackWord(q.src, ok);
  if (q.type === 'mc') document.querySelectorAll('.choice').forEach(b => {
    if (b.textContent === q.answer) b.classList.add('good');
    else if (b.classList.contains('selected')) b.classList.add('bad');
  });
  const praise = ['آفرین!', 'عالی بود!', 'درسته!', 'بسیار خوب!'];
  finish(ok, ok ? praise[Math.floor(Math.random() * praise.length)] : 'درست نبود', ok ? '' : 'پاسخ درست: ' + shown, false);
}
/* فهرست واژه‌های اشتباه: اشتباه اضافه، درست حذف */
function trackWord([fa, en], ok) {
  S.wrong = S.wrong || [];
  const i = S.wrong.findIndex(x => x[0] === fa && x[1] === en);
  if (ok && i >= 0 && CUR && CUR.mistakes) S.wrong.splice(i, 1);
  if (!ok && i < 0) S.wrong.push([fa, en]);
  if (S.wrong.length > 40) S.wrong.shift();
  saveState();
}
function speak(t) {
  if (!('speechSynthesis' in window)) return toast('مرورگر پخش صدا را پشتیبانی نمی‌کند.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u);
}
function finish(ok, title, ans, isMatch) {
  Q.locked = true; $('checkBtn').disabled = true;
  if (!ok) { loseHeart(); }
  if (isMatch) Q.attempts++;
  const fb = $('feedback'); fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
  set('fbText', (ok ? '✅ ' : '❌ ') + title);
  const a = $('fbAns'); a.textContent = ans; a.className = 'fbAns' + (/[A-Za-z]/.test(ans.replace('پاسخ درست:', '')) ? '' : '');
  const q = Q.queue.shift();
  if (ok) Q.passed++; else Q.queue.push(q); // اشتباه‌ها دوباره پرسیده می‌شوند
  if (!ok && S.hearts <= 0) { Q.dead = true; }
  $('progressFill').style.width = (Q.passed / Q.total * 100) + '%';
}
function nextQuestion() {
  if (!Q) return;
  if (Q.dead) return failLesson();
  if (Q.queue.length === 0) return completeLesson();
  renderQuestion();
}

/* ── پایان درس ── */
function failLesson() {
  hideFeedback(); Q = null;
  $('resultIcon').textContent = '💔'; set('resultTitle', 'جان‌هایت تمام شد');
  set('resultSub', 'نیم ساعت دیگر یک جان برمی‌گردد. در این فاصله واژه‌ها را مرور کن!');
  set('earned', '+۰'); set('accuracy', '—'); set('elapsed', '—');
  showScreen('result');
}
function completeLesson() {
  hideFeedback();
  const first = CUR.id >= 0 && !S.done.includes(CUR.id);
  const acc = Math.round(Q.right / Math.max(1, Q.attempts) * 100);
  const xp = 10 + Q.right * 2 + (acc === 100 ? 5 : 0) + (first ? 10 : 0);
  S.xp += xp; if (first) S.done.push(CUR.id); if (!CUR.mistakes) updateStreak(); saveState();
  const sec = Math.round((Date.now() - Q.start) / 1000);
  $('resultIcon').textContent = acc >= 90 ? '🏆' : acc >= 70 ? '🎉' : '👍';
  set('resultTitle', acc >= 90 ? 'فوق‌العاده بود!' : acc >= 70 ? 'آفرین!' : 'درس کامل شد');
  set('resultSub', first && CUR.id + 1 < LESSONS.length ? 'درس بعدی باز شد!' : CUR.id + 1 >= LESSONS.length && first ? 'تبریک! همه‌ی درس‌ها را تمام کردی 🎓' : 'مرورِ خوبی بود.');
  set('earned', '+' + p(xp)); set('accuracy', p(acc) + '٪');
  set('elapsed', p(Math.floor(sec / 60)) + ':' + p(String(sec % 60).padStart(2, '0')));
  Q = null; showScreen('result');
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !Q) return;
  if ($('feedback').classList.contains('show')) nextQuestion();
  else if (!$('checkBtn').disabled && $('checkBtn').style.display !== 'none') checkAnswer();
});
function openProfile() {
  $('profStats').innerHTML = [['امتیاز', S.xp], ['زنجیره', S.streak], ['درس‌های انجام‌شده', S.done.length], ['واژه‌های یادگرفته', wordsLearned()], ['اشتباهات ذخیره‌شده', (S.wrong || []).length]]
    .map(r => `<div class="prow"><span>${r[0]}</span><b>${p(r[1])}</b></div>`).join('');
  showScreen('profile');
}
$('profBtn').addEventListener('click', openProfile);
$('profBack').addEventListener('click', () => showScreen('home'));
function doReset() {
  try { localStorage.removeItem('englishfa'); } catch (e) {}
  S = loadState(); saveState(); renderHome(); showScreen('home'); toast('اطلاعات پاک شد');
}
$('resetBtn').addEventListener('click', () => {
  askConfirm('همه‌ی پیشرفت پاک شود؟ این کار برگشت‌پذیر نیست.', 'پاک کردن', doReset);
});
renderHome();
/* پنجره‌ی تأیید هماهنگ با ظاهر سایت (جای confirm مرورگر) */
function askConfirm(msg, okText, onOk) {
  const bg = el('div', 'cfBg');
  const box = el('div', 'cfBox');
  const t = el('p', 'cfMsg', msg);
  const row = el('div', 'cfRow');
  const no = el('button', 'btn secondary', 'انصراف');
  const yes = el('button', 'btn danger', okText);
  const close = () => bg.remove();
  no.onclick = close;
  yes.onclick = () => { close(); onOk(); };
  row.append(no, yes); box.append(t, row); bg.appendChild(box);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
}

</script>
</body>
</html>
